name: Analisi Salotto

on:
  push:
    branches: [ analisi ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compila e analizza
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew compileReleaseKotlin lintRelease --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Avvisi Kotlin
        if: always()
        shell: bash
        run: grep -E '^(w|e): ' build.log || echo "nessuno"
      - name: Rapporto lint
        if: always()
        shell: bash
        run: cat app/build/reports/lint-results-release.txt 2>/dev/null || find app/build/reports -name '*.txt'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint
          path: |
            build.log
            app/build/reports/
